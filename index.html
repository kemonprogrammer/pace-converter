<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">


  <title>Pace Converter</title>
  <link href="/src/style.css" rel="stylesheet" />
</head>

<body
  class="bg-[#1a263a] sm:bg-slate-900 text-slate-100 min-h-dvh flex sm:items-center items-start justify-center p-0 sm:p-6 font-sans">

  <main
    class="w-full sm:max-w-md sm:bg-slate-800/80 sm:backdrop-blur-xl sm:border border-slate-700/60 sm:rounded-3xl p-4 sm:p-8 sm:shadow-2xl space-y-8">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-700/50 pb-5 mb-5">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
          <i data-lucide="gauge" class="w-6 h-6 text-indigo-400"></i>
          Pace Converter
        </h1>
        <p class="text-sm text-slate-400 mt-1">Calculate and convert running metrics effortlessly</p>
      </div>
    </header>

    <!-- Pace & Speed Section -->
    <section class="space-y-4 relative mb-[80px]">
      <div class="relative flex items-end justify-between">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-indigo-400">Pace & Speed</h2>
        <!-- <button type="button" title="Recalculate speed" -->
        <!--   class="absolute right-0 -top-2 p-2.5 bg-slate-900 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition-all duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-500/50"> -->
        <!--   <i data-lucide="rotate-ccw" class="w-5 h-5"></i> -->
        <!-- </button> -->

      </div>

      <div class="grid grid-cols-2 gap-4 rounded-2xl">
        <!-- min/km -->
        <div class="space-y-1.5">
          <!-- <label class="block text-sm font-medium text-slate-400">min / km</label> -->
          <div class="relative">
            <input id="min-per-km" type="text" placeholder="5:30"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg -ml-[1px] px-3.5 py-2.5 text-lg font-medium text-white placeholder-slate-500 placeholder:italic focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            <span class="text-slate-500 pointer-events-none absolute z-100 right-2 top-1/2 -translate-y-1/2 "> min/km</span>
          </div>
        </div>

        <!-- km/h -->
        <div class="space-y-1.5">
          <!-- <label class="block text-sm font-medium text-slate-400">km / h</label> -->
          <div class="relative">
            <input id="km-per-h" type="number" placeholder=""
              class="w-full bg-slate-900 border border-slate-700 rounded-lg -ml-[1px] px-3.5 py-2.5 text-lg font-medium text-white placeholder-slate-500 placeholder:italic focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            <span class="text-slate-500 pointer-events-none absolute  right-2 top-1/2 -translate-y-1/2 ">km/h</span>
          </div>
        </div>

        <!-- min/mile -->
        <div class="space-y-1.5">
          <!-- <label class="block text-sm font-medium text-slate-400">min / mile</label> -->
          <div class="relative">
            <input id="min-per-mile" type="text" placeholder=""
              class="w-full bg-slate-900 border border-slate-700 rounded-lg -ml-[1px] px-3.5 py-2.5 text-lg font-medium text-white placeholder-slate-500 placeholder:italic focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            <span class="text-slate-500 pointer-events-none absolute z-100 right-2 top-1/2 -translate-y-1/2 ">min/mi</span>
          </div>
        </div>

        <!-- mph -->
        <div class="space-y-1.5">
          <!-- <label class="block text-sm font-medium text-slate-400">mph</label> -->
          <div class="relative">
            <input id="mile-per-h" type="number" placeholder=""
              class="w-full bg-slate-900 border border-slate-700 rounded-lg -ml-[1px] px-3.5 py-2.5 text-lg font-medium text-white placeholder-slate-500 placeholder:italic focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
            <span class="text-slate-500 pointer-events-none absolute z-100 right-2 top-1/2 -translate-y-1/2 ">mph</span>
          </div>
        </div>
      </div>
      <button id="recalculate-pace" type="button"
        class="absolute invisible flex items-center justify-center gap-2 w-full p-2.5 bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-full text-slate-400 text-sm hover:text-white transition active:scale-95 cursor-pointer">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>

        Calculate required pace
      </button>

    </section>

    <!-- Distance & Time Section -->
    <section class="space-y-4">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-indigo-400">Workout Targets</h2>

      <div class="space-y-4">
        <!-- Distance -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-400">Distance</label>
          <div class="flex items-center gap-2">
            <div class="flex flex-1 min-w-0">

              <input id="distance" type="number" placeholder="e.g. 10.2"
                class="min-w-0 flex-1 bg-slate-900 border border-slate-700 rounded-l-lg -ml-[1px] px-3.5 py-2.5 text-lg font-medium text-white placeholder-slate-500 placeholder:italic focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
              <select id="distance-unit"
                class="bg-slate-900 border border-slate-700 rounded-r-lg px-3 py-3 text-lg font-medium text-slate-300 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                <option value="km">km</option>
                <option value="mi">mi</option>
                <option value="m">m</option>
                <!-- </options> -->
              </select>
            </div>


            <button id="recalculate-distance" type="button" title="Calculate distance"
              class="p-3.5 bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-lg text-slate-400 hover:text-white transition active:scale-95 cursor-pointer">
              <i data-lucide="rotate-ccw" class="w-4.5 h-4.5"></i>
            </button>
          </div>
        </div>

        <!-- Duration -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-slate-400">Duration</label>
          <div class="flex items-center gap-2">
            <div class="flex flex-1 min-w-0">
              <input id="duration" type="text" placeholder="e.g. 30m30"
                class="min-w-0 flex-1 bg-slate-900 border border-slate-700 rounded-l-lg -ml-[1px] px-3.5 py-2.5 text-lg font-medium text-white placeholder-slate-500 placeholder:italic focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
              <select id="duration-unit"
                class="bg-slate-900 border border-slate-700 rounded-r-lg px-3 py-3 text-lg font-medium text-slate-300 focus:outline-none focus:border-indigo-500 transition cursor-pointer">
                <option value="mins">mins</option>
                <option value="hours">hours</option>
              </select>
            </div>
            <button id="recalculate-time" type="button" title="Calculate time"
              class="p-3.5 bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-lg text-slate-400 hover:text-white transition active:scale-95 cursor-pointer">
              <i data-lucide="rotate-ccw" class="w-4.5 h-4.5"></i>
            </button>
          </div>
        </div>
      </div>

    </section>

  </main>

  <script src="https://unpkg.com/lucide@1.28.0"></script>
  <script>
    lucide.createIcons();
  </script>
  <script src="/src/index.ts" type="module"></script>
</body>

</html>
